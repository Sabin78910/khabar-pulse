<!doctype html>
<html lang="ne" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Khabar Pulse: fast, clean Nepal and world news from many outlets, with duplicate stories merged and every source credited." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0B0B0F" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Khabar Pulse · खबर पल्स</title>
    <script>
      try {
        var t = localStorage.getItem("kp.theme");
        t = t ? JSON.parse(t) : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
