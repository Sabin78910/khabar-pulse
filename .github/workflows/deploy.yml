name: Deploy to GitHub Pages

# Builds the site AND the news: runs the RSS pipeline in Node and publishes news.json with the site.
# This is the fallback that works with no Cloudflare account. Every 30 minutes (GitHub cron can lag),
# on every push, on demand, and after each Worker deploy (worker.yml dispatches it).
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Find the Worker API (only if Cloudflare is set up and the Worker answers)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_URL_VAR: ${{ vars.VITE_API_URL }}
        run: |
          API="$API_URL_VAR"
          if [ -z "$API" ] && [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            SUB=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq -r '.result.subdomain // empty' || true)
            [ -n "$SUB" ] && API="https://khabar-pulse-api.$SUB.workers.dev"
          fi
          if [ -n "$API" ] && curl -fsS -m 10 "$API/api/health" | jq -e '.ok == true' >/dev/null 2>&1; then
            echo "VITE_API_URL=$API" >> "$GITHUB_ENV"; echo "Using Worker API $API"
          else
            echo "No live Worker API; the app uses news.json only."
          fi
      - name: Build the news (RSS pipeline)
        env:
          PREVIOUS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/news.json
        run: npm run news
      - run: npm run build
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
