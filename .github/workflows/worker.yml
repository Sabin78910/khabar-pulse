name: Deploy Worker API

# Deploys the Cloudflare Worker (cron every 10 min → KV → /api/news).
# Runs only when the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist; otherwise it skips.
on:
  push:
    branches: [main]
    paths: ["worker/**", "src/pipeline/**", "src/config/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check for Cloudflare secrets
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping the Worker deploy. The site uses news.json."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.ok == 'true'
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.ok == 'true'
        with: { node-version: 24, cache: npm }
      - if: steps.gate.outputs.ok == 'true'
        run: npm ci && npm i --no-save wrangler@4
      - name: Create or find the KV namespace
        if: steps.gate.outputs.ok == 'true'
        working-directory: worker
        run: |
          TITLE="khabar-pulse-NEWS"
          ID=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=100" \
            | jq -r --arg t "$TITLE" '.result[] | select(.title==$t) | .id' | head -1)
          if [ -z "$ID" ]; then
            ID=$(curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              -d "{\"title\":\"$TITLE\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" | jq -r '.result.id')
          fi
          [ -n "$ID" ] && [ "$ID" != "null" ] || { echo "Could not create the KV namespace"; exit 1; }
          sed -i "s/REPLACED_BY_CI/$ID/" wrangler.toml
      - name: Deploy
        if: steps.gate.outputs.ok == 'true'
        working-directory: worker
        run: npx wrangler deploy
      - name: Warm up (first refresh) and rebuild the site so it uses the API
        if: steps.gate.outputs.ok == 'true'
        working-directory: worker
        run: |
          # Seed KV with the latest news.json so the API answers before the first cron run.
          if curl -fsS -m 20 "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/news.json" -o "$RUNNER_TEMP/news.json"; then
            npx wrangler kv key put news:v1 --path "$RUNNER_TEMP/news.json" --binding NEWS --remote || true
          fi
          SUB=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
          echo "Worker: https://khabar-pulse-api.$SUB.workers.dev/api/news (the cron fills KV within 10 minutes)"
          echo "### Worker API: https://khabar-pulse-api.$SUB.workers.dev/api/news" >> "$GITHUB_STEP_SUMMARY"
          gh workflow run deploy.yml --ref main -R "$GITHUB_REPOSITORY"
